<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMR Fleet Command Center</title>
  <meta name="description" content="Real-time fleet monitoring dashboard for decentralized AMR coordination system" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Top Bar ── -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">AMR <span class="accent">FLEET</span></span>
      </div>
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot disconnected" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>
    <div class="topbar-metrics" id="topbarMetrics">
      <div class="metric-pill">
        <span class="metric-label">Tasks Done</span>
        <span class="metric-value" id="metricTasksDone">0</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Conflicts Avoided</span>
        <span class="metric-value" id="metricConflicts">0</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Efficiency</span>
        <span class="metric-value" id="metricEfficiency">—</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Uptime</span>
        <span class="metric-value" id="metricUptime">00:00</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-ghost" id="btnScenario" onclick="cycleScenario()">Scenario: <span id="scenarioLabel">Medium</span></button>
      <button class="btn-primary" id="btnPause" onclick="togglePause()">⏸ Pause</button>
    </div>
  </header>

  <!-- ── Main Layout ── -->
  <main class="layout">

    <!-- ── Left: Robot Status Cards ── -->
    <aside class="sidebar-left" id="sidebarLeft">
      <h2 class="section-title">Fleet Status</h2>
      <div class="robot-cards" id="robotCards">
        <!-- Generated by JS -->
        <div class="robot-card skeleton" id="card-R1"></div>
        <div class="robot-card skeleton" id="card-R2"></div>
        <div class="robot-card skeleton" id="card-R3"></div>
      </div>

      <h2 class="section-title" style="margin-top:2rem">Event Log</h2>
      <div class="event-log" id="eventLog">
        <p class="log-placeholder">Waiting for simulation…</p>
      </div>
    </aside>

    <!-- ── Center: Warehouse Map ── -->
    <section class="map-container" id="mapContainer">
      <div class="map-header">
        <span class="map-title">Warehouse Floor — 20×20m</span>
        <div class="map-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#6366f1"></span>Robot</span>
          <span class="legend-item"><span class="legend-dot" style="background:#22c55e"></span>Pickup</span>
          <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Dropoff</span>
          <span class="legend-item"><span class="legend-dot" style="background:#ef4444;opacity:.5"></span>Dead Zone</span>
        </div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="warehouseCanvas"></canvas>
        <div class="canvas-overlay" id="canvasOverlay"></div>
      </div>
    </section>

    <!-- ── Right: Task Queue & Stats ── -->
    <aside class="sidebar-right" id="sidebarRight">
      <h2 class="section-title">Task Queue</h2>
      <div class="task-list" id="taskList">
        <p class="log-placeholder">No tasks yet…</p>
      </div>

      <h2 class="section-title" style="margin-top:2rem">Performance</h2>
      <div class="perf-chart" id="perfChart">
        <canvas id="perfCanvas" width="220" height="120"></canvas>
      </div>
      <div class="perf-labels">
        <span class="perf-label">Smart Routing</span>
        <span class="perf-label" style="color:#64748b">Stop & Wait</span>
      </div>

      <h2 class="section-title" style="margin-top:2rem">Network</h2>
      <div class="network-grid" id="networkGrid">
        <div class="net-card" id="net-R1"><span class="net-id">R1</span><span class="net-latency" id="latR1">—ms</span></div>
        <div class="net-card" id="net-R2"><span class="net-id">R2</span><span class="net-latency" id="latR2">—ms</span></div>
        <div class="net-card" id="net-R3"><span class="net-id">R3</span><span class="net-latency" id="latR3">—ms</span></div>
      </div>
    </aside>

  </main>

  <script src="app.js"></script>
</body>
</html>
